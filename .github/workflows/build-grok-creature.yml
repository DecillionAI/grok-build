# ─────────────────────────────────────────────────────────────
# build-grok-creature — pre-build the Grok Build creature binary
# ─────────────────────────────────────────────────────────────
# Compiles the `grok` CLI **from this repository's own crates/** (never a
# downloaded release), packages it with the caspar/ signaling bridge into a
# portable bundle, and publishes it three ways:
#
#   1. workflow artifact        — bundle.tar.gz + grok + manifest.json
#   2. GitHub Release assets    — on a v* tag (or a manual run with make_release)
#   3. prebuilt container image — pushed to GHCR (ghcr.io/<owner>/grok-build-creature)
#
# The point is to do the heavy build ONCE, here, so the later Caspar deploy is
# lightweight: `decillionai-server/scripts/ci-deploy.sh` **downloads** the bundle
# this workflow published and feeds it to `scripts/deploy_grok_creature.py` with
# GROK_CLI_SOURCE=prebuilt — the node's image build is then a copy, and the deploy
# host compiles nothing at all (no Rust toolchain, no cargo, no crates.io).
#
# For that to work the bundle must be fetchable **without credentials** — the
# deploy host has no token for this repo (its GITHUB_TOKEN belongs to another org,
# and the workflow-artifacts API always requires auth). So every push publishes a
# rolling per-branch **release**, whose asset URL is stable and unauthenticated:
#
#   https://github.com/<owner>/grok-build/releases/download/creature-<branch>/bundle.tar.gz
#
# `creature-main` is what a default deploy pulls; a feature branch gets its own
# `creature-<branch-with-slashes-dashed>` tag, so a branch can be deployed and
# tested before it merges. Tagged `v*` builds additionally publish a normal
# versioned release, and every run uploads the workflow artifact + the GHCR image.
# ─────────────────────────────────────────────────────────────
name: build-grok-creature

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
    # Only what the creature is built from — docs and unrelated crates changes do
    # not need a fresh bundle.
    paths:
      - "crates/**"
      - "caspar/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build-grok-creature.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Build and push the prebuilt image to GHCR."
        required: false
        type: boolean
        default: true
      make_release:
        description: "Also publish a versioned GitHub Release (always on for v* tags)."
        required: false
        type: boolean
        default: false

# Least privilege: read the repo, write Releases, write GHCR packages.
permissions:
  contents: write
  packages: write

concurrency:
  group: build-grok-creature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1) Build the CLI from source and package the portable bundle ───────────
  bundle:
    # Pinned to the OLDEST supported runner on purpose. The binary is dynamically
    # linked, so the glibc it is built against is a *floor* on every machine that
    # later runs it — the creature image (Debian trixie, 2.41) and the deploy host
    # that smoke-tests the download. Building on 22.04 (glibc 2.35) keeps that
    # floor low; building on the newest runner would strand older hosts.
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        # The proto build resolves bin/protoc through DotSlash; the system protoc
        # is the supported alternative and needs no download at build time.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: grok-creature-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: grok-creature-cargo-

      - name: Build + package the creature bundle (from crates/, not a release download)
        env:
          OUT_DIR: out
        run: bash scripts/package-creature.sh

      - name: Show manifest
        run: cat out/manifest.json

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-build-creature-bundle
          path: |
            out/bundle.tar.gz
            out/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Rolling release tag for this branch
        id: tag
        # `creature-<branch>` with slashes dashed — the stable, unauthenticated URL
        # the Decillion deploy host pulls from. A v* tag publishes under the tag
        # itself instead, as a normal versioned release.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          else
            TAG="creature-$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
            echo "rolling=true" >> "$GITHUB_OUTPUT"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing the bundle as release '$TAG'"

      - name: Publish the bundle as a release asset
        # Every build publishes, because the deploy host can only fetch releases:
        # its token cannot read this repo's workflow artifacts (cross-org, and the
        # artifacts API needs auth even for public repos). Re-running on the same
        # branch updates the release in place, so the URL never changes.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.rolling == 'true' && format('Grok Build creature ({0})', github.ref_name) || format('Grok Build creature {0}', github.ref_name) }}
          # A rolling per-branch build is a moving target, not a version: keep it a
          # prerelease and never let it become the repo's "latest".
          prerelease: ${{ steps.tag.outputs.rolling == 'true' }}
          make_latest: ${{ steps.tag.outputs.rolling != 'true' }}
          body: |
            Pre-built Grok Build creature binary, compiled from this repository's
            `crates/` at `${{ github.sha }}` (not a published release download).

            - `bundle.tar.gz` — portable build context (`bin/grok` + the `caspar/`
              bridge). This is what `decillionai-server`'s deploy downloads and
              wraps in the creature image (`caspar/Dockerfile.prebuilt`); deploy it
              by hand with `GROK_CLI_SOURCE=prebuilt`.
            - `manifest.json` — version, git sha, sizes, the build host's glibc.

            Prebuilt image: `ghcr.io/${{ github.repository_owner }}/grok-build-creature`
          files: |
            out/bundle.tar.gz
            out/manifest.json
          fail_on_unmatched_files: true

  # ── 2) Build the prebuilt runtime image and push it to GHCR ────────────────
  image:
    needs: bundle
    runs-on: ubuntu-latest
    # Push by default; a manual run can opt out with push_image=false.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
    steps:
      - name: Checkout (for caspar/Dockerfile.prebuilt)
        uses: actions/checkout@v4

      - name: Download the prebuilt bundle
        uses: actions/download-artifact@v4
        with:
          name: grok-build-creature-bundle
          path: out

      - name: Assemble the docker build context
        run: |
          mkdir -p context
          cp out/bundle.tar.gz context/bundle.tar.gz
          cp caspar/Dockerfile.prebuilt context/Dockerfile.prebuilt
          ls -lh context

      - name: Lowercase the image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/grok-build-creature" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push the prebuilt creature image
        uses: docker/build-push-action@v6
        with:
          context: ./context
          file: ./context/Dockerfile.prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Prebuilt Grok Build creature image"
            echo ""
            echo "Pushed tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
