# ─────────────────────────────────────────────────────────────
# build-grok-creature — pre-build the Grok Build creature binary
# ─────────────────────────────────────────────────────────────
# Compiles the `grok` CLI **from this repository's own crates/** (never a
# downloaded release), packages it with the caspar/ signaling bridge into a
# portable bundle, and publishes it three ways:
#
#   1. workflow artifact        — bundle.tar.gz + grok + manifest.json
#   2. GitHub Release assets    — on a v* tag (or a manual run with make_release)
#   3. prebuilt container image — pushed to GHCR (ghcr.io/<owner>/grok-build-creature)
#
# The point is to do the heavy build ONCE, here, so the later Caspar deploy is
# lightweight: `decillionai-server/scripts/ci-deploy.sh` **downloads** the bundle
# this workflow published and feeds it to `scripts/deploy_grok_creature.py` with
# GROK_CLI_SOURCE=prebuilt — the node's image build is then a copy, and the deploy
# host compiles nothing at all (no Rust toolchain, no cargo, no crates.io).
#
# For that to work the bundle must be fetchable **without credentials** — the
# deploy host has no token for this repo (its GITHUB_TOKEN belongs to another org,
# and the workflow-artifacts API always requires auth). So every push publishes a
# rolling per-branch **release**, whose asset URL is stable and unauthenticated:
#
#   https://github.com/<owner>/grok-build/releases/download/creature-<branch>/bundle.tar.gz
#
# `creature-main` is what a default deploy pulls; a feature branch gets its own
# `creature-<branch-with-slashes-dashed>` tag, so a branch can be deployed and
# tested before it merges. Tagged `v*` builds additionally publish a normal
# versioned release, and every run uploads the workflow artifact + the GHCR image.
# ─────────────────────────────────────────────────────────────
name: build-grok-creature

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Only what the creature is built from — docs and unrelated crates changes do
    # not need a fresh bundle.
    paths:
      - "crates/**"
      - "caspar/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build-grok-creature.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Build and push the prebuilt image to GHCR."
        required: false
        type: boolean
        default: true
      make_release:
        description: "Also publish a versioned GitHub Release (always on for v* tags)."
        required: false
        type: boolean
        default: false

# Least privilege: read the repo, write Releases, write GHCR packages.
permissions:
  contents: write
  packages: write

concurrency:
  group: build-grok-creature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1) Build the CLI from source and package the portable bundle ───────────
  bundle:
    # Built once per CPU architecture. The `grok` binary is a native ELF, so it
    # only runs on the arch it was compiled for — an amd64 binary on an arm64
    # (Graviton) deploy host dies with `Exec format error` at the image build's
    # `grok --version` smoke test, which is exactly what stranded the arm64 host.
    # So publish BOTH: an amd64 `bundle.tar.gz` (the historical asset name, kept
    # unchanged) and an arm64 `bundle-arm64.tar.gz`; the deploy pulls the one that
    # matches its host (see decillionai-server ci-deploy.sh + deploy_grok_creature.py).
    #
    # Each leg is pinned to the OLDEST supported runner of its arch on purpose. The
    # binary is dynamically linked, so the glibc it is built against is a *floor* on
    # every machine that later runs it — the creature image (Debian trixie, 2.41)
    # and the deploy host that smoke-tests the download. Building on 22.04 (glibc
    # 2.35) keeps that floor low; building on the newest runner would strand older
    # hosts.
    strategy:
      fail-fast: false
      # Serialize the two arches: both publish to the SAME rolling release
      # (creature-<branch>), and softprops/action-gh-release racing to create that
      # release from two jobs at once can 422. One at a time is plenty — the cargo
      # cache makes the second leg cheap. amd64 goes first so, if arm64 hosted
      # runners are ever unavailable, the historical amd64 asset still publishes.
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            bundle_asset: bundle.tar.gz
            manifest_asset: manifest.json
          - arch: arm64
            runner: ubuntu-22.04-arm
            bundle_asset: bundle-arm64.tar.gz
            manifest_asset: manifest-arm64.json
    runs-on: ${{ matrix.runner }}
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No protoc step: scripts/package-creature.sh resolves one itself, downloading
      # the exact version bin/protoc pins (hash-verified) when the runner has no
      # DotSlash and no protoc new enough. Installing apt's protobuf-compiler here
      # would be actively wrong on this runner — 22.04 ships 3.12, which rejects the
      # proto3 optional fields this tree uses.

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .protoc-cache
          key: grok-creature-cargo-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'bin/protoc') }}
          restore-keys: grok-creature-cargo-${{ matrix.arch }}-

      - name: Build + package the creature bundle (from crates/, not a release download)
        env:
          OUT_DIR: out
        run: bash scripts/package-creature.sh

      - name: Name the bundle assets for ${{ matrix.arch }}
        # package-creature.sh always writes out/bundle.tar.gz + out/manifest.json.
        # amd64 keeps those historical names; arm64 gets the -arm64 suffix so both
        # arches can live on the one rolling release without clobbering each other.
        run: |
          if [ "${{ matrix.arch }}" != "amd64" ]; then
            cp -f out/bundle.tar.gz "out/${{ matrix.bundle_asset }}"
            cp -f out/manifest.json "out/${{ matrix.manifest_asset }}"
          fi

      - name: Show manifest
        run: cat "out/${{ matrix.manifest_asset }}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-build-creature-bundle-${{ matrix.arch }}
          path: |
            out/${{ matrix.bundle_asset }}
            out/${{ matrix.manifest_asset }}
          if-no-files-found: error
          retention-days: 30

      - name: Rolling release tag for this branch
        id: tag
        # `creature-<branch>` with slashes dashed — the stable, unauthenticated URL
        # the Decillion deploy host pulls from. A v* tag publishes under the tag
        # itself instead, as a normal versioned release.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          else
            TAG="creature-$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
            echo "rolling=true" >> "$GITHUB_OUTPUT"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing the bundle as release '$TAG'"

      - name: Publish the bundle as a release asset
        # Every build publishes, because the deploy host can only fetch releases:
        # its token cannot read this repo's workflow artifacts (cross-org, and the
        # artifacts API needs auth even for public repos). Re-running on the same
        # branch updates the release in place, so the URL never changes. Each arch
        # leg uploads only its own asset pair, so the two legs are additive on the
        # shared rolling release rather than overwriting one another.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.rolling == 'true' && format('Grok Build creature ({0})', github.ref_name) || format('Grok Build creature {0}', github.ref_name) }}
          # A rolling per-branch build is a moving target, not a version: keep it a
          # prerelease and never let it become the repo's "latest".
          prerelease: ${{ steps.tag.outputs.rolling == 'true' }}
          make_latest: ${{ steps.tag.outputs.rolling != 'true' }}
          body: |
            Pre-built Grok Build creature binary, compiled from this repository's
            `crates/` at `${{ github.sha }}` (not a published release download).
            Published per CPU architecture — the deploy pulls the asset matching
            its host:

            - `bundle.tar.gz` / `manifest.json` — **amd64/x86_64**.
            - `bundle-arm64.tar.gz` / `manifest-arm64.json` — **arm64/aarch64**
              (e.g. AWS Graviton deploy hosts).

            Each `bundle*.tar.gz` is a portable build context (`bin/grok` + the
            `caspar/` bridge) that `decillionai-server`'s deploy downloads and wraps
            in the creature image (`caspar/Dockerfile.fetch`); the matching
            `manifest*.json` carries the version, git sha, sizes, build glibc and
            build arch.

            Prebuilt image: `ghcr.io/${{ github.repository_owner }}/grok-build-creature`
          files: |
            out/${{ matrix.bundle_asset }}
            out/${{ matrix.manifest_asset }}
          fail_on_unmatched_files: true

  # ── 2) Build the prebuilt runtime image and push it to GHCR ────────────────
  image:
    needs: bundle
    runs-on: ubuntu-latest
    # Push by default; a manual run can opt out with push_image=false.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
    steps:
      - name: Checkout (for caspar/Dockerfile.prebuilt)
        uses: actions/checkout@v4

      - name: Download the prebuilt bundle
        # The GHCR image is amd64 (ubuntu-latest is x86_64); take the amd64 leg's
        # artifact, which carries the historical out/bundle.tar.gz name.
        uses: actions/download-artifact@v4
        with:
          name: grok-build-creature-bundle-amd64
          path: out

      - name: Assemble the docker build context
        run: |
          mkdir -p context
          cp out/bundle.tar.gz context/bundle.tar.gz
          cp caspar/Dockerfile.prebuilt context/Dockerfile.prebuilt
          ls -lh context

      - name: Lowercase the image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/grok-build-creature" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push the prebuilt creature image
        uses: docker/build-push-action@v6
        with:
          context: ./context
          file: ./context/Dockerfile.prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Prebuilt Grok Build creature image"
            echo ""
            echo "Pushed tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
